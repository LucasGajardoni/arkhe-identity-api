services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arkhe_identity
      POSTGRES_USER: arkhe
      POSTGRES_PASSWORD: arkhe_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkhe -d arkhe_identity"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://arkhe:arkhe_dev_password@postgres:5432/arkhe_identity
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
