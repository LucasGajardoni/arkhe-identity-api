[project]
name = "arkhe-identity-api"
version = "0.1.0"
description = "Provedor privado academico de validacao de identidade para o Banco Arkhe."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.41",
  "alembic==1.16.4",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.7",
  "email-validator==2.2.0",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "jinja2==3.1.6",
  "pillow==11.3.0",
  "cryptography==45.0.5",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.1.3",
  "PyJWT==2.10.1",
  "slowapi==0.1.9",
  "rapidfuzz==3.13.0",
  "numpy==2.2.6",
  "opencv-contrib-python-headless==4.12.0.88",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "httpx==0.28.1",
  "ruff==0.12.4",
  "mypy==1.17.0",
  "types-passlib==1.7.7.20250602",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["B008", "E501", "S101", "S105", "S108", "S110", "E402"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
