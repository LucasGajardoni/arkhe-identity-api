<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arkhe Identity API</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <h1>Identity API</h1>
        <p id="versao-painel" style="color:#526577;font-size:12px;margin-top:-12px">Painel biométrico atualizado · 26/10/2026</p>
        <form id="login-form" class="grid">
          <input name="username" autocomplete="username" placeholder="usuario admin" required />
          <input name="password" type="password" autocomplete="current-password" placeholder="senha" required />
          <button type="submit">Entrar</button>
        </form>
      </section>

      <section class="panel">
        <h2>Aplicacoes cliente</h2>
        <form id="client-form" class="grid">
          <input name="name" placeholder="Nome da aplicacao" required />
          <input name="slug" placeholder="slug-publico" required />
          <input name="client_secret" placeholder="client secret definido pelo cliente" minlength="24" required />
          <button type="submit">Criar aplicacao</button>
        </form>
        <pre id="client-secret"></pre>
        <div id="clients" class="list"></div>
      </section>

      <section class="panel">
        <h2>Identidades</h2>
        <div id="identities" class="list"></div>
      </section>
    </main>
    <script src="/static/admin.js?v=20261026-2"></script>
  </body>
</html>
